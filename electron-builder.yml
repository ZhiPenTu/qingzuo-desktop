appId: com.commerce.tools.desktop
productName: Qingzuo
artifactName: CommerceTools-${version}-${os}-${arch}.${ext}
directories:
  output: release/desktop
files:
  - dist/**/*
  - desktop/**/*
  # The packaged desktop updater imports this shared validation/download module
  # at runtime; keep it in app.asar alongside the desktop sources.
  - scripts/update-cli-proxy.mjs
  - packages/platform-bundle/**/*
  - packages/plugin-sdk/**/*
  - package.json
afterPack: desktop/after-pack.cjs
forceCodeSigning: false
npmRebuild: false
asarUnpack:
  - node_modules/**/*.node
extraResources:
  - from: resources/generated
    to: commerce
mac:
  icon: desktop/icons/icon.icns
  asarUnpack:
    - node_modules/**/*
  target: [dmg, zip]
  minimumSystemVersion: '15.0'
  hardenedRuntime: true
  identity: '-'
  notarize: false
  entitlements: desktop/entitlements.mac.plist
win:
  icon: desktop/icons/icon.ico
  target: [nsis]
  signExts: ['.exe', '.dll', '.pyd', '.node']
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: ZhiPenTu
  repo: qingzuo-desktop
  releaseType: release
