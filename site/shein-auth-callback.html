<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>希音授权成功 · 轻作</title>
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background: #f6f7f5;
        color: #19211d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 40px));
        padding: 40px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 18px 60px rgb(24 33 29 / 12%);
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #28654a;
        color: white;
        font-size: 28px;
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0; color: #66756f; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">✓</div>
      <h1>希音授权成功</h1>
      <p>请返回轻作继续操作。</p>
    </main>
  </body>
</html>
