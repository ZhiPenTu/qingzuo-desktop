<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>输入访问密钥</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20352b; background: #f7faf7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; color: #596b61; line-height: 1.5; }
    .detail { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #edf3ee; font-size: 12px; white-space: pre-wrap; }
    form { margin-top: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #b9c9bf; border-radius: 8px; background: #fff; font: inherit; }
    input:focus { outline: 2px solid #2f6d4f; outline-offset: 1px; }
    .error { min-height: 19px; margin-top: 6px; color: #a32c2c; font-size: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    button { padding: 8px 14px; border: 1px solid #b9c9bf; border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
    button[type=submit] { border-color: #2f6d4f; background: #2f6d4f; color: #fff; }
  </style>
</head>
<body>
  <h1 id="title">输入访问密钥</h1>
  <p id="message"></p>
  <div id="detail" class="detail" hidden></div>
  <form id="form">
    <label id="label" for="secret">访问密钥</label>
    <input id="secret" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="error" class="error" role="alert"></div>
    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button id="submit" type="submit">保存</button>
    </div>
  </form>
</body>
</html>
