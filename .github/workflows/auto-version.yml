name: Auto version
on:
  workflow_dispatch:
    inputs:
      target:
        description: '目标版本号（X.Y.Z 正式版本）'
        required: true
        type: string
      notes:
        description: '发布日志要点，一行一条'
        required: true
        type: string

concurrency:
  group: auto-version-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 递增版本号
        id: version
        run: |
          set -euo pipefail
          result=$(node scripts/auto-version.mjs --target "${{ inputs.target }}")
          echo "$result"
          echo "next=$(echo "$result" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).next")" >> "$GITHUB_OUTPUT"

      - name: 写入发布日志
        env:
          NEXT: ${{ steps.version.outputs.next }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          file="docs/releases/v${NEXT}.md"
          if [[ -e "${file}" ]]; then
            echo "::error::发布日志已存在：${file}"
            exit 1
          fi
          if [[ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]]; then
            echo "::error::发布日志要点不能为空"
            exit 1
          fi
          mkdir -p docs/releases
          {
            echo "# 轻作 Qingzuo v${NEXT}"
            echo
            printf '%s\n' "${NOTES}" | awk 'NF { sub(/^[[:space:]]*[-*][[:space:]]*/, ""); print "- " $0 }'
            echo
            echo "支持 macOS 15+ Apple Silicon、Windows 10+ x64。"
          } > "${file}"

      - name: 提交版本更新
        id: push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "codex/auto-version-v${NEXT}"
          git add package.json package-lock.json docs/release-guide.md "docs/releases/v${NEXT}.md"
          git commit -m "chore: 版本更新至 v${NEXT}"
          git push -u origin "codex/auto-version-v${NEXT}"
          echo "branch=codex/auto-version-v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: 创建版本更新 PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          url=$(gh pr create --base main --head "$BRANCH" --title "chore: 发布轻作 v${NEXT}" --body "由 Auto version 准备的正式版本 v${NEXT}：同步 package.json、package-lock.json 与 docs/release-guide.md，并写入 docs/releases/v${NEXT}.md。合并后在 main 打 v${NEXT} 标签触发发版。")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$url" | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"

      - name: 批准并等待分支策略检查
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -euo pipefail
          conclusion=""
          for attempt in $(seq 1 90); do
            # 机器人创建的 PR 触发的工作流默认挂起等待批准，这里自行批准以保持流程无人值守。
            for run in $(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --status action_required --json databaseId --jq '[.[].databaseId] | join(" ")'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" > /dev/null 2>&1 || true
            done
            conclusion=$(gh pr view "$NUMBER" --json statusCheckRollup --jq '[.statusCheckRollup[]? | select(.name == "branch-policy") | .conclusion] | join(",")')
            if [[ "${conclusion^^}" == "SUCCESS" ]]; then break; fi
            if [[ "${conclusion^^}" == "FAILURE" || "${conclusion^^}" == "CANCELLED" ]]; then
              echo "::error::Branch policy 未通过，版本更新 PR 保留待人工处理"
              exit 1
            fi
            sleep 10
          done
          if [[ "${conclusion^^}" != "SUCCESS" ]]; then
            echo "::error::等待 Branch policy 超时，版本更新 PR 保留待人工处理"
            exit 1
          fi
          gh pr merge "$NUMBER" --merge --delete-branch

      - name: 输出发版提示
        if: success()
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "版本 PR 已合入 main。打标签发版：" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "git fetch origin && git tag -a v${NEXT} -m \"轻作 Qingzuo v${NEXT}\" origin/main && git push origin v${NEXT}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
