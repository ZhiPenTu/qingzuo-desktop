name: Release plugin SDK
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/platform/sdk.test.mjs
      - run: mkdir -p release/sdk && npm pack --workspace @commerce/plugin-sdk --pack-destination release/sdk
      - name: Publish versioned SDK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e "import pkg from './packages/plugin-sdk/package.json' with {type:'json'}; if(process.env.GITHUB_REF_NAME!=='sdk-v'+pkg.version) throw new Error('SDK tag mismatch');"
          gh release create "$GITHUB_REF_NAME" release/sdk/*.tgz --verify-tag --title "Plugin SDK $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-SDK
          path: release/sdk/*.tgz
