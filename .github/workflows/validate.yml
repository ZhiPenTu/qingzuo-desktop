name: Validate commerce desktop
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
      COMMERCE_DESKTOP_SIGNING: unsigned
      COMMERCE_PLUGIN_PUBLIC_KEY: ${{ vars.COMMERCE_PLUGIN_PUBLIC_KEY }}
      COMMERCE_MARKET_PUBLIC_KEY: ${{ vars.COMMERCE_MARKET_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'native/sandbox -> target'
      - name: Pure platform checks
        run: |
          npm ci --ignore-scripts
          npm run upstream:check
          node node_modules/electron/install.js
          npm run build:harness-native
          npm test
          npm run build
          npm run build:sandbox
          npm run platform:prepare
          node scripts/verify-macos-runtime.mjs
          npm run test:platform
          node scripts/test-plugin-navigation.mjs
          npm run test:desktop
      - name: Package and verify standalone platform
        run: |
          node scripts/package-desktop.mjs --dir
          if [[ "$RUNNER_OS" == "macOS" ]]; then node scripts/verify-macos-runtime.mjs "release/desktop/mac-arm64/Qingzuo.app"; fi
          node scripts/test-packaged-desktop.mjs
          if [[ "$RUNNER_OS" == "macOS" ]]; then node scripts/test-component-update.mjs; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Commerce-validation-${{ runner.os }}
          path: |
            output/electron-tests/
            output/update-validation/
            release/desktop/
