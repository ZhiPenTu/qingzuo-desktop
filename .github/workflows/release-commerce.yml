name: Release commerce desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '验收版本，需与 package.json 一致；不会公开发布'
        required: true
        type: string
      signing:
        description: '桌面签名模式'
        type: choice
        default: unsigned
        options: [unsigned, signed]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COMMERCE_VALIDATION_VERSION: ${{ inputs.version }}
      COMMERCE_DESKTOP_SIGNING: ${{ inputs.signing || vars.COMMERCE_DESKTOP_SIGNING || 'unsigned' }}
      COMMERCE_PLUGIN_SIGNING_KEY: ${{ secrets.COMMERCE_PLUGIN_SIGNING_KEY }}
      COMMERCE_PLUGIN_PUBLIC_KEY: ${{ vars.COMMERCE_PLUGIN_PUBLIC_KEY }}
      COMMERCE_MARKET_PUBLIC_KEY: ${{ vars.COMMERCE_MARKET_PUBLIC_KEY }}
      CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'native/sandbox -> target'
      - name: Require release configuration
        run: node scripts/release-preflight.mjs
      - name: Pure platform checks
        run: |
          npm ci --ignore-scripts
          npm run upstream:check
          node node_modules/electron/install.js
          npm run build:harness-native
          npm test
          npm run build
          npm run build:sandbox
          npm run platform:prepare
          node scripts/verify-macos-runtime.mjs
          npm run test:platform
          node scripts/test-plugin-navigation.mjs
          npm run test:desktop
      - name: Build standalone installers
        run: |
          node scripts/package-desktop.mjs
          node scripts/test-packaged-desktop.mjs
          node scripts/test-windows-installer.mjs
      - name: Verify production signatures
        if: ${{ env.COMMERCE_DESKTOP_SIGNING == 'signed' }}
        run: node scripts/verify-signatures.mjs
      - name: Build signed macOS update components
        if: runner.os == 'macOS'
        run: |
          node scripts/component-artifacts.mjs
          node scripts/test-component-update.mjs --release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Commerce-${{ runner.os }}
          path: |
            release/desktop/
            release/components/
  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMERCE_PLUGIN_PUBLIC_KEY: ${{ vars.COMMERCE_PLUGIN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Commerce-*
          path: release
          merge-multiple: true
      - name: Publish validated release
        run: gh release create "$GITHUB_REF_NAME" release/desktop/*.dmg release/desktop/*.zip release/desktop/*.exe release/desktop/*.blockmap release/desktop/latest*.yml release/components/* --verify-tag --title "轻作 Qingzuo $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify public Release bytes and update signatures
        run: |
          npm ci --ignore-scripts
          mkdir -p output/public-release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > output/release.json
          gh release download "$GITHUB_REF_NAME" --dir output/public-release
          node scripts/verify-public-release.mjs output/release.json output/public-release
      - uses: actions/upload-artifact@v4
        with:
          name: Public-release-verification
          path: output/public-release/verification.json
