name: Check and validate upstream upgrades
on:
  pull_request:
    paths:
      - 'desktop/upstream/**'
      - 'desktop/ai-harness.mjs'
      - 'desktop/ai-proxy.mjs'
      - 'desktop/harness-version.mjs'
      - 'scripts/*harness*.mjs'
      - 'scripts/*cli-proxy*.mjs'
      - 'scripts/prepare-ai-proxy.mjs'
      - 'tests/fixtures/harness/**'
      - 'tests/platform/*harness*.test.mjs'
      - 'tests/platform/cli-proxy-*.test.mjs'
      - '.github/workflows/upstream.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to inspect; a version also runs isolated candidate validation'
        type: choice
        default: both
        options: [both, cli-proxy, harness]
      version:
        description: 'Explicit candidate version (select one component)'
        type: string
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run upstream:check
      - name: Check official releases
        env:
          COMPONENT: ${{ inputs.component || 'both' }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$CANDIDATE_VERSION" && "$COMPONENT" == "both" ]]; then
            echo 'Select one component when specifying a candidate version.' >&2
            exit 1
          fi
          if [[ "$COMPONENT" == "both" || "$COMPONENT" == "harness" ]]; then
            node scripts/harness-upstream.mjs check-upstream --report output/upstream/harness-check.json
          fi
          if [[ "$COMPONENT" == "both" || "$COMPONENT" == "cli-proxy" ]]; then
            node scripts/update-cli-proxy.mjs --check --report output/upstream/cli-proxy-check.json
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CANDIDATE_VERSION="$(node -p "require('./desktop/upstream/cli-proxy.json').version")"
          fi
          if [[ ("$COMPONENT" == "cli-proxy" || "${{ github.event_name }}" == "pull_request") && -n "$CANDIDATE_VERSION" ]]; then
            node scripts/update-cli-proxy.mjs --prepare --version "$CANDIDATE_VERSION" --candidate output/upstream/cli-proxy-candidate.json --report output/upstream/cli-proxy-prepare.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Upstream-inspection
          path: output/upstream/*.json
  cli-proxy:
    needs: inspect
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.component == 'cli-proxy' && inputs.version != '')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: Upstream-inspection
          path: output/upstream
      - run: npm ci --ignore-scripts
      - run: npm run build:harness-native
      - run: node scripts/validate-cli-proxy.mjs --manifest output/upstream/cli-proxy-candidate.json --report output/upstream/cli-proxy-smoke-${{ runner.os }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CLIProxy-smoke-${{ runner.os }}
          path: output/upstream/cli-proxy-smoke-*.json
  cli-proxy-report:
    needs: cli-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: CLIProxy-smoke-*
          path: output/upstream
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: Upstream-inspection
          path: output/upstream
      - run: node scripts/validate-cli-proxy.mjs --manifest output/upstream/cli-proxy-candidate.json --combine output/upstream/cli-proxy-smoke-macOS.json output/upstream/cli-proxy-smoke-Windows.json --report output/upstream/cli-proxy-validation.json
      - uses: actions/upload-artifact@v7
        with:
          name: CLIProxy-promotion-evidence
          path: |
            output/upstream/cli-proxy-candidate.json
            output/upstream/cli-proxy-validation.json
  harness:
    needs: inspect
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.component == 'harness' && inputs.version != '')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare and validate isolated candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$CANDIDATE_VERSION" ]]; then
            CANDIDATE_VERSION="$(node -p "require('./desktop/upstream/harness.json').version")"
          fi
          node scripts/harness-upstream.mjs prepare --version "$CANDIDATE_VERSION" --directory output/upstream/harness-candidate --report output/upstream/harness-prepare.json
          node scripts/harness-upstream.mjs validate --directory output/upstream/harness-candidate --report output/upstream/harness-validation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Harness-candidate-${{ runner.os }}
          path: |
            output/upstream/*-*.json
            output/upstream/harness-candidate/package.json
            output/upstream/harness-candidate/package-lock.json
            output/upstream/harness-candidate/packages/platform-bundle/package.json
            output/upstream/harness-candidate/desktop/upstream/harness.json
